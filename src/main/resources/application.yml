server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: parts-trace-backend
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${KEWEI_DBSERVER:localhost}:${KEWEI_DBPORT:3306}/parts_trace?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${KEWEI_DBUSER:root}
    password: ${KEWEI_DBPWD:}
    druid:
      initial-size: 2
      min-idle: 1
      max-active: 5
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
# MyBatis-Plus閰嶇疆
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.kewei.parts
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-value: 1
      logic-not-delete-value: 0

# 鏃ュ織閰嶇疆
logging:
  level:
    root: INFO
    com.kewei.parts: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"
  file:
    name: logs/parts-trace.log

# Swagger/SpringDoc閰嶇疆
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# Actuator閰嶇疆
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# IPFS閰嶇疆
ipfs:
  host: ${IPFS_HOST:127.0.0.1}
  port: ${IPFS_PORT:5001}
  gateway: http://${IPFS_HOST:127.0.0.1}:8080

# JWT閰嶇疆
jwt:
  secret: ${JWT_SECRET:}
  expiration: 86400000
  refresh-expiration: 604800000
  header: Authorization
  prefix: "Bearer "

# DID
did:
  method: chainmaker
  chain-id: ${CHAINMAKER_CHAIN_ID:chain1}

# 每个逻辑链独立选择平台；db模式不初始化任何真实SDK。
blockchain:
  timeout-ms: ${BLOCKCHAIN_TIMEOUT_MS:60000}
  relay-private-key: ${RELAY_PRIVATE_KEY:}
  networks:
    main-regulator:
      platform: ${MAIN_CHAIN_PLATFORM:CHAINMAKER}
      sdk-config: ${MAIN_CHAIN_CONFIG:${CHAINMAKER_MAIN_CONFIG:}}
      expected-chain-id: ${MAIN_CHAIN_ID:}
      contract-name: ${CHAINMAKER_CONTRACT_NAME:trace_anchor}
      group: ${MAIN_CHAIN_GROUP:group0}
      contract-address: ${MAIN_CHAIN_CONTRACT_ADDRESS:}
      expected-account: ${MAIN_CHAIN_ACCOUNT:}
    sub-production:
      platform: ${PRODUCTION_CHAIN_PLATFORM:CHAINMAKER}
      sdk-config: ${PRODUCTION_CHAIN_CONFIG:${CHAINMAKER_PRODUCTION_CONFIG:}}
      expected-chain-id: ${PRODUCTION_CHAIN_ID:}
      contract-name: ${CHAINMAKER_CONTRACT_NAME:trace_anchor}
      group: ${PRODUCTION_CHAIN_GROUP:group0}
      contract-address: ${PRODUCTION_CHAIN_CONTRACT_ADDRESS:}
      expected-account: ${PRODUCTION_CHAIN_ACCOUNT:}
    sub-quality:
      platform: ${QUALITY_CHAIN_PLATFORM:CHAINMAKER}
      sdk-config: ${QUALITY_CHAIN_CONFIG:${CHAINMAKER_QUALITY_CONFIG:}}
      expected-chain-id: ${QUALITY_CHAIN_ID:}
      contract-name: ${CHAINMAKER_CONTRACT_NAME:trace_anchor}
      group: ${QUALITY_CHAIN_GROUP:group0}
      contract-address: ${QUALITY_CHAIN_CONTRACT_ADDRESS:}
      expected-account: ${QUALITY_CHAIN_ACCOUNT:}
    sub-logistics:
      platform: ${LOGISTICS_CHAIN_PLATFORM:FISCO_BCOS}
      sdk-config: ${LOGISTICS_CHAIN_CONFIG:${FISCO_LOGISTICS_CONFIG:}}
      expected-chain-id: ${LOGISTICS_CHAIN_ID:${FISCO_LOGISTICS_CHAIN_ID:}}
      contract-name: ${CHAINMAKER_CONTRACT_NAME:trace_anchor}
      group: ${LOGISTICS_CHAIN_GROUP:${FISCO_LOGISTICS_GROUP:group0}}
      contract-address: ${LOGISTICS_CHAIN_CONTRACT_ADDRESS:${FISCO_LOGISTICS_CONTRACT_ADDRESS:}}
      expected-account: ${LOGISTICS_CHAIN_ACCOUNT:${FISCO_LOGISTICS_ACCOUNT:}}

# Trace storage adapters
parts:
  trace:
    storage:
      chain-mode: ${PARTS_TRACE_CHAIN_MODE:db}
      object-mode: ${PARTS_TRACE_OBJECT_MODE:db}


security:
  key-encryption-key: ${KEY_ENCRYPTION_KEY:}
